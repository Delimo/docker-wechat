name: Build WeChat-Rime

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 解决 Node.js 警告：强制使用 Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键步骤：将镜像名称（包含用户名）转换为全小写
      - name: Lowercase image name
        run: |
          echo "IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6 # 升级到 v6 
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 使用上面处理好的全小写 IMAGE_ID
          tags: |
            ${{ env.IMAGE_ID }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
